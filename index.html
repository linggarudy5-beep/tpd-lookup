<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPD Lookup</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6fb;
  color: #17243b;
}

.container {
  width: min(900px, 94%);
  margin: auto;
  padding: 30px 0 50px;
}

.hero {
  background: linear-gradient(135deg, #135daf, #31588f);
  color: white;
  border-radius: 0 0 30px 30px;
  padding: 35px 28px;
  box-shadow: 0 14px 35px rgba(0,0,0,.12);
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  border: 1px solid rgba(255,255,255,.3);
}

.brand h1 {
  margin: 0;
  font-size: 30px;
}

.brand p {
  margin: 5px 0 0;
  opacity: .85;
}

.search {
  margin-top: 28px;
  background: white;
  padding: 10px;
  border-radius: 20px;
  display: flex;
  gap: 10px;
}

.search input {
  flex: 1;
  border: 0;
  outline: 0;
  font-size: 18px;
  padding: 14px;
  min-width: 0;
}

.search button {
  border: 0;
  background: #135daf;
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 0 24px;
  border-radius: 14px;
  cursor: pointer;
}

.search button:hover {
  background: #0e4c92;
}

.card {
  background: white;
  margin-top: 25px;
  border: 1px solid #e0e6ef;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 8px 25px rgba(35,58,91,.07);
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.section-title h2 {
  margin: 0;
  font-size: 21px;
}

.reset {
  border: 1px solid #d6deea;
  background: white;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
}

.status {
  text-align: center;
  color: #68758a;
  padding: 20px;
}

.error {
  color: #b9472e;
  text-align: center;
  padding: 20px;
}

.result-grid {
  display: grid;
  gap: 14px;
}

.field {
  background: #f7f9fc;
  border-radius: 15px;
  padding: 17px;
}

.field-label {
  font-size: 13px;
  color: #68758a;
  margin-bottom: 7px;
}

.field-value {
  font-size: 18px;
  font-weight: bold;
  word-break: break-word;
}

.history {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid #d7dfeb;
  background: white;
  padding: 9px 13px;
  border-radius: 999px;
  cursor: pointer;
  color: #31588f;
}

.footer {
  text-align: center;
  color: #8a95a5;
  font-size: 13px;
  margin-top: 25px;
}

@media (max-width: 600px) {
  .container {
    width: 100%;
    padding-top: 0;
  }

  .hero {
    border-radius: 0 0 28px 28px;
    padding: 25px 18px 28px;
  }

  .brand h1 {
    font-size: 27px;
  }

  .search {
    flex-direction: column;
  }

  .search button {
    height: 50px;
  }

  .card {
    margin: 18px 12px 0;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <section class="hero">

    <div class="brand">
      <div class="logo">TPD</div>

      <div>
        <h1>TPD Lookup</h1>
        <p>Pencarian data TPD secara cepat</p>
      </div>
    </div>

    <form class="search" id="searchForm">
      <input
        id="tpdInput"
        type="text"
        placeholder="Masukkan TPD_id..."
        autocomplete="off"
      >

      <button type="submit">
        CARI
      </button>
    </form>

  </section>


  <section class="card">

    <div class="section-title">
      <h2>Hasil Pencarian</h2>

      <button class="reset" onclick="resetResult()">
        Reset
      </button>
    </div>

    <div id="result">
      <div class="status">
        Masukkan TPD_id kemudian klik CARI.
      </div>
    </div>

  </section>


  <section class="card">

    <div class="section-title">
      <h2>Riwayat</h2>
    </div>

    <div id="history" class="history"></div>

  </section>


  <div class="footer">
    TPD Lookup • Data diambil dari Google Sheets
  </div>

</div>


<script>

/* =====================================================
   APPS SCRIPT WEB APP
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwqV50eW5b_2MIrbN_mIh8c9-eHvG-WNitdp9ipbJyUSDaTVDosQYQk6C3uk4Z1EUZe/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const searchForm = document.getElementById("searchForm");
const tpdInput = document.getElementById("tpdInput");
const resultBox = document.getElementById("result");
const historyBox = document.getElementById("history");


/* =====================================================
   SEARCH
   ===================================================== */

searchForm.addEventListener("submit", function(e) {

  e.preventDefault();

  const tpd = tpdInput.value.trim();

  if (!tpd) {
    resultBox.innerHTML =
      '<div class="error">Silakan masukkan TPD_id.</div>';

    return;
  }

  resultBox.innerHTML =
    '<div class="status">Mencari data...</div>';

  searchTPD(tpd);

});


/* =====================================================
   JSONP SEARCH
   ===================================================== */

function searchTPD(tpd) {

  const callbackName =
    "tpdCallback_" + Date.now();

  const script = document.createElement("script");

  const url =
    APPS_SCRIPT_URL +
    "?tpd=" +
    encodeURIComponent(tpd) +
    "&callback=" +
    callbackName;

  let finished = false;

  window[callbackName] = function(data) {

    finished = true;

    delete window[callbackName];

    script.remove();

    if (data && data.ok) {

      showResult(data);

      saveHistory(data.TPD_id);

    } else {

      resultBox.innerHTML =
        '<div class="error">' +
        escapeHtml(
          data && data.error
            ? data.error
            : "Data tidak ditemukan."
        ) +
        '</div>';

    }

  };

  script.onerror = function() {

    if (finished) return;

    delete window[callbackName];

    script.remove();

    resultBox.innerHTML =
      '<div class="error">' +
      'Tidak dapat terhubung ke server Apps Script.' +
      '</div>';

  };

  document.body.appendChild(script);

  setTimeout(function() {

    if (!finished) {

      finished = true;

      delete window[callbackName];

      script.remove();

      resultBox.innerHTML =
        '<div class="error">' +
        'Waktu koneksi habis. Pastikan Apps Script sudah di-deploy sebagai Web App.' +
        '</div>';

    }

  }, 15000);

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showResult(data) {

  resultBox.innerHTML = `

    <div class="result-grid">

      <div class="field">
        <div class="field-label">
          TPD_id
        </div>

        <div class="field-value">
          ${escapeHtml(data.TPD_id || "-")}
        </div>
      </div>


      <div class="field">
        <div class="field-label">
          Category1
        </div>

        <div class="field-value">
          ${escapeHtml(data.Category1 || "-")}
        </div>
      </div>


      <div class="field">
        <div class="field-label">
          LOM remark
        </div>

        <div class="field-value">
          ${escapeHtml(data.LOM_remark || "-")}
        </div>
      </div>

    </div>

  `;

}


/* =====================================================
   RESET
   ===================================================== */

function resetResult() {

  tpdInput.value = "";

  resultBox.innerHTML =
    '<div class="status">Masukkan TPD_id kemudian klik CARI.</div>';

  tpdInput.focus();

}


/* =====================================================
   HISTORY
   ===================================================== */

function saveHistory(tpd) {

  let history =
    JSON.parse(
      localStorage.getItem("tpdHistory") || "[]"
    );

  history =
    history.filter(x => x !== tpd);

  history.unshift(tpd);

  history = history.slice(0, 10);

  localStorage.setItem(
    "tpdHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function renderHistory() {

  let history =
    JSON.parse(
      localStorage.getItem("tpdHistory") || "[]"
    );

  if (!history.length) {

    historyBox.innerHTML =
      '<span style="color:#8a95a5">Belum ada riwayat.</span>';

    return;
  }

  historyBox.innerHTML =
    history.map(function(tpd) {

      return `
        <button
          class="chip"
          onclick="useHistory('${escapeAttribute(tpd)}')">
          ${escapeHtml(tpd)}
        </button>
      `;

    }).join("");

}


function useHistory(tpd) {

  tpdInput.value = tpd;

  searchTPD(tpd);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


/* =====================================================
   INITIAL HISTORY
   ===================================================== */

renderHistory();

</script>

</body>
</html>
