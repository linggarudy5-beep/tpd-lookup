<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPD Lookup</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6fb;
  color: #17243b;
}

.container {
  width: min(900px, 94%);
  margin: auto;
  padding: 24px 0 40px;
}

.hero {
  background: linear-gradient(135deg, #135daf, #31588f);
  color: white;
  border-radius: 0 0 28px 28px;
  padding: 30px 24px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.hero h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

.hero p {
  margin: 0;
  opacity: .9;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

.search-row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border: 1px solid #ccd5e2;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #135daf;
  box-shadow: 0 0 0 3px rgba(19,93,175,.12);
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 20px;
  background: #135daf;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.secondary {
  background: #e9eef5;
  color: #17243b;
}

.result {
  display: none;
}

.result.success {
  display: block;
}

.result.error {
  display: block;
}

.result-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.field {
  padding: 15px;
  background: #f6f8fb;
  border-radius: 12px;
  margin-bottom: 12px;
}

.field-label {
  font-size: 12px;
  color: #65748b;
  margin-bottom: 5px;
  font-weight: bold;
  text-transform: uppercase;
}

.field-value {
  font-size: 16px;
  font-weight: 600;
  word-break: break-word;
}

.error-box {
  background: #fff1f1;
  color: #a32020;
  padding: 15px;
  border-radius: 12px;
  line-height: 1.5;
}

.history-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.history-title h2 {
  margin: 0;
  font-size: 18px;
}

.history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.history-item {
  background: #edf3fb;
  color: #135daf;
  border-radius: 10px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 13px;
}

.sheet {
  overflow: hidden;
}

.sheet iframe {
  width: 100%;
  height: 600px;
  border: 0;
  border-radius: 12px;
}

.loading {
  display: none;
  text-align: center;
  padding: 15px;
  color: #135daf;
  font-weight: bold;
}

.example {
  margin-top: 8px;
  color: #65748b;
  font-size: 13px;
}

@media (max-width: 600px) {
  .container {
    width: 94%;
    padding-top: 10px;
  }

  .hero {
    padding: 25px 18px;
  }

  .hero h1 {
    font-size: 24px;
  }

  .search-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .sheet iframe {
    height: 500px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <div class="container">
    <h1>TPD Lookup</h1>
    <p>Cari data TPD_id dengan cepat</p>
  </div>
</div>

<div class="container">

  <div class="card">
    <label for="tpdInput">TPD_id</label>

    <div class="search-row">
      <input
        id="tpdInput"
        type="text"
        placeholder="Contoh: 25-T01-XLS-34-0006"
        autocomplete="off"
      >

      <button onclick="searchTPD()">CARI</button>
    </div>

    <div class="example">
      Contoh: 25-T01-XLS-34-0006
    </div>

    <div id="loading" class="loading">
      Sedang mencari data...
    </div>
  </div>

  <div id="resultCard" class="card result">
    <div class="result-title">Hasil Pencarian</div>

    <div class="field">
      <div class="field-label">TPD_id</div>
      <div id="resultTPD" class="field-value">-</div>
    </div>

    <div class="field">
      <div class="field-label">Category1</div>
      <div id="resultCategory" class="field-value">-</div>
    </div>

    <div class="field">
      <div class="field-label">LOM remark</div>
      <div id="resultLOM" class="field-value">-</div>
    </div>
  </div>

  <div id="errorCard" class="card result">
    <div id="errorMessage" class="error-box"></div>
  </div>

  <div class="card">
    <div class="history-title">
      <h2>Riwayat Pencarian</h2>
      <button class="secondary" onclick="clearHistory()">Reset</button>
    </div>

    <div id="historyList" class="history-list"></div>
  </div>

  <div class="card sheet">
    <div class="result-title">Google Sheet</div>

    <iframe
      src="https://docs.google.com/spreadsheets/d/1Gjw-xdFsTkp4-lw1NIxwRKcnjJ7YX4oYyFWih9njUMU/edit?gid=0#gid=0">
    </iframe>
  </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwqV50eW5b_2MIrbN_mIh8c9-eHvG-WNitdp9ipbJyUSDaTVDosQYQk6C3uk4Z1EUZe/exec";

let callbackCounter = 0;
let timeoutTimer = null;

function searchTPD() {

  const input = document.getElementById("tpdInput");
  const tpd = input.value.trim();

  if (!tpd) {
    showError("Silakan masukkan TPD_id terlebih dahulu.");
    return;
  }

  showLoading(true);
  hideResults();

  callbackCounter++;

  const callbackName = "tpdCallback_" + Date.now() + "_" + callbackCounter;

  const script = document.createElement("script");

  const url =
    APPS_SCRIPT_URL +
    "?tpd=" + encodeURIComponent(tpd) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&_=" + Date.now();

  window[callbackName] = function(data) {

    clearTimeout(timeoutTimer);

    try {
      if (data && data.ok) {

        showResult(
          data.TPD_id || tpd,
          data.Category1 || "-",
          data.LOM_remark || "-"
        );

        saveHistory(data.TPD_id || tpd);

      } else {

        showError(
          data && data.error
            ? data.error
            : "Data tidak ditemukan."
        );
      }

    } catch (err) {

      showError("Terjadi kesalahan saat membaca hasil.");

    } finally {

      showLoading(false);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];
    }
  };

  script.onerror = function() {

    clearTimeout(timeoutTimer);

    showLoading(false);

    showError(
      "Gagal terhubung ke Apps Script. " +
      "Pastikan Web App sudah di-deploy dengan akses Anyone."
    );

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window[callbackName];
  };

  document.body.appendChild(script);

  timeoutTimer = setTimeout(function() {

    showLoading(false);

    showError(
      "Waktu koneksi habis. Pastikan Apps Script sudah " +
      "di-deploy sebagai Web App dan versi terbaru sudah aktif."
    );

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window[callbackName];

  }, 15000);
}


function showResult(tpd, category, lom) {

  const card = document.getElementById("resultCard");

  document.getElementById("resultTPD").textContent = tpd;
  document.getElementById("resultCategory").textContent = category;
  document.getElementById("resultLOM").textContent = lom;

  card.className = "card result success";
}


function showError(message) {

  const card = document.getElementById("errorCard");

  document.getElementById("errorMessage").textContent = message;

  card.className = "card result error";
}


function hideResults() {

  document.getElementById("resultCard").className =
    "card result";

  document.getElementById("errorCard").className =
    "card result";
}


function showLoading(show) {

  document.getElementById("loading").style.display =
    show ? "block" : "none";
}


function saveHistory(tpd) {

  let history = getHistory();

  history = history.filter(function(item) {
    return item.toLowerCase() !== tpd.toLowerCase();
  });

  history.unshift(tpd);

  history = history.slice(0, 10);

  localStorage.setItem(
    "tpd_lookup_history",
    JSON.stringify(history)
  );

  renderHistory();
}


function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem("tpd_lookup_history")
    ) || [];

  } catch (e) {

    return [];
  }
}


function renderHistory() {

  const list = document.getElementById("historyList");
  const history = getHistory();

  list.innerHTML = "";

  if (!history.length) {

    list.innerHTML =
      '<span style="color:#65748b;font-size:13px;">Belum ada riwayat.</span>';

    return;
  }

  history.forEach(function(tpd) {

    const item = document.createElement("div");

    item.className = "history-item";
    item.textContent = tpd;

    item.onclick = function() {

      document.getElementById("tpdInput").value = tpd;

      searchTPD();
    };

    list.appendChild(item);
  });
}


function clearHistory() {

  localStorage.removeItem("tpd_lookup_history");

  renderHistory();
}


document.getElementById("tpdInput").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      searchTPD();
    }

  }
);


renderHistory();

</script>

</body>
</html>
